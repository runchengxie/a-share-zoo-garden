name: association-study-provider-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Collect registered observations
        id: collect
        continue-on-error: true
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_TOKEN_2: ${{ secrets.TUSHARE_TOKEN_2 }}
          TUSHARE_API_URL: ${{ secrets.TUSHARE_API_URL }}
        run: >-
          uv run python -m zoo_index.association_live
          --runtime-dir "$RUNNER_TEMP/association-study"
          --public-output "$RUNNER_TEMP/association-study-public/association_study.json"
      - name: Upload reviewed-snapshot candidate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: association-study-public
          path: ${{ runner.temp }}/association-study-public/association_study.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail when provider verification failed
        if: steps.collect.outcome != 'success'
        run: exit 1
