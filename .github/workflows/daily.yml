name: zoo-index-daily

on:
  schedule:
    - cron: "10 8 * * 1-5"
  workflow_dispatch:
    inputs:
      cache_export:
        description: "临时导出缺失的历史原始缓存"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      backfill_mode:
        description: "回填模式：missing 只补缺失日期，all 重算指定历史区间"
        required: false
        default: missing
        type: choice
        options:
          - missing
          - all
      backfill_days:
        description: "手动回填交易日数量；默认 1，仅刷新最近交易日"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: zoo-index-pages
  cancel-in-progress: false

jobs:
  export-raw-cache:
    if: inputs.cache_export == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Fetch missing raw dates
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_TOKEN_2: ${{ secrets.TUSHARE_TOKEN_2 }}
          TUSHARE_API_URL: ${{ secrets.TUSHARE_API_URL }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          from zoo_index.data_sources.tushare import TushareClient

          dates = '''20210817 20210818 20210819 20210820 20210823 20210824 20210825 20210826 20210827 20210830 20210831 20210901 20210902 20260907 20260908 20260909 20260910 20260911'''.split()
          root = Path('raw-export')
          client = TushareClient(os.environ['TUSHARE_TOKEN'], cache_dir=root,
              token2=os.getenv('TUSHARE_TOKEN_2') or None,
              api_url2=os.getenv('TUSHARE_API_URL') or None)
          for reference in (client.get_stock_basic, client.get_namechange):
              df = reference()
              if df.empty:
                  raise RuntimeError('reference dataset is empty')
          for date in dates:
              if client.get_daily(date).empty or client.get_adj_factor(date).empty:
                  raise RuntimeError(f'{date}: stock price/factor missing')
              if client.get_fund_daily(date, '510300.SH').empty or client.get_fund_adj(date, '510300.SH').empty:
                  raise RuntimeError(f'{date}: benchmark price/factor missing')
          for date in sorted(set(dates + ['20210903'])):
              df = client.get_suspension(date)
              if df.empty:
                  path = root / 'suspension' / f'{date}.parquet'
                  path.parent.mkdir(parents=True, exist_ok=True)
                  pd.DataFrame(columns=['ts_code', 'suspend_date', 'suspend_type']).to_parquet(path, index=False)
          print(f'Exported {len(dates)} trading days and reference datasets')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zoo-raw-cache-missing
          path: raw-export/
          retention-days: 1
  build-and-deploy:
    if: inputs.cache_export != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Install Python deps
        run: uv sync --frozen

      - name: Compute index (更新最近交易日)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          BACKFILL_MODE: ${{ inputs.backfill_mode || 'missing' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
        run: uv run python -m zoo_index --output-dir published --backfill "$BACKFILL_DAYS" --backfill-mode "$BACKFILL_MODE"

      - name: Compute plant index (更新最近交易日)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          BACKFILL_MODE: ${{ inputs.backfill_mode || 'missing' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
        run: uv run python -m zoo_index --rules plant_rules.yml --output-dir published/plant --backfill "$BACKFILL_DAYS" --backfill-mode "$BACKFILL_MODE"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add published
          git diff --cached --quiet && echo "无数据变更" || git commit -m "chore: 每日数据更新"

      - name: Push data
        if: success()
        run: git push

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
