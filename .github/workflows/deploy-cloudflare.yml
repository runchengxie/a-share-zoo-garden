name: deploy-cloudflare

on:
  workflow_dispatch:
  workflow_run:
    workflows: [zoo-index-daily]
    types: [completed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare published data
        run: |
          mkdir -p web/public/data
          cp published/data/*.json web/public/data/
          mkdir -p web/public/data/plant
          cp published/plant/data/*.json web/public/data/plant/

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Create Cloudflare Pages project if missing
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create a-share-zoo-garden --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=a-share-zoo-garden
