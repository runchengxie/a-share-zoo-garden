[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-zoo-garden"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyarrow",
  "pyyaml",
  "tushare",
  "matplotlib",
]

[project.optional-dependencies]
formal = [
  "quant-backtest-runtime @ git+https://github.com/runchengxie/quant-backtest-runtime.git@af5444874561002f8471caa136e1053db6a97246 ; python_version >= '3.12'",
  "quant-platform @ git+https://github.com/runchengxie/quant-platform.git@59c432baf5395f8fdd8cffe2dd7d02276c2526ae ; python_version >= '3.12'",
  "research-contracts @ git+https://github.com/runchengxie/quant-platform.git@59c432baf5395f8fdd8cffe2dd7d02276c2526ae#subdirectory=packages/research-contracts ; python_version >= '3.12'",
]

[project.scripts]
zoo-index = "zoo_index.cli:main"
zoo-chart = "redraw_chart:main"
zoo-audit = "zoo_index.cli:audit_main"
zoo-rule-comparison = "zoo_index.rule_comparison:main"
zoo-formal-diagnostic = "zoo_index.formal_execution:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["run_daily", "redraw_chart"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --cov=zoo_index --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PERF", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ty]
